name: release

on:
  push:
    tags:
      - "v*"

# Declared per job rather than here: the test and deb jobs need nothing beyond
# reading the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the package
        run: ./scripts/build-deb.sh
      - name: Check it against the tag
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$version" != "$tag" ]; then
            echo "pyproject version $version does not match tag $tag" >&2
            exit 1
          fi
          # The package Version: comes from pyproject but the changelog ships
          # verbatim, so an ungated changelog would describe a different
          # release than the one being built.
          changelog=$(sed -n '1s/^viewwall (\(.*\)-[^-]*).*/\1/p' packaging/debian/changelog)
          if [ "$changelog" != "$tag" ]; then
            echo "debian/changelog version $changelog does not match tag $tag" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Without these the action emits only "0.1.0": no "latest", and no
          # "0.1" to follow patch releases. flavor keeps latest off a
          # pre-release tag such as v0.2.0-rc1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Pi 3 is armhf and the Pi 4/5 are arm64; amd64 is not useful
          # here because the wall needs a real KMS device.
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [deb, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
