name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - name: The package must build
        run: ./scripts/build-deb.sh
      # The image builds the package inside its first stage, so a change to
      # the build script or to debian/control can break it. Only the release
      # workflow published an image, which meant finding that out at tag time.
      # Native architecture only: buildx and QEMU belong to the release job,
      # and what is being checked here is that the Dockerfile still builds.
      - name: The image must build
        run: docker build -t viewwall:ci .
